<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse, search and download from STAC APIs, including Lantmäteriet's Swedish orthophoto, elevation and vector catalogs."
    />
    <meta name="color-scheme" content="light dark" />
    <title>STAC API Browser</title>
    <script>
      ;(function (location) {
        if (location.search[1] !== '/') return
        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(
          null,
          '',
          location.pathname.slice(0, -1) + decoded + location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
