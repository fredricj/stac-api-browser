<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>STAC API Browser</title>
    <script>
      // GitHub Pages has no server-side rewrites, so it serves this file for
      // any path that is not a real file on disk — which, for a
      // client-side-routed SPA, is almost every URL the app itself generates
      // (e.g. /stac-api-browser/api/lantmateriet-bild). There is nothing to
      // render here: this only encodes the real path into a query string and
      // sends the browser back to the site root, where the matching script in
      // index.html's <head> decodes it and restores the URL with
      // `history.replaceState` before Vue Router ever reads it.
      //
      // Standard workaround, credited to rafgraph/spa-github-pages. Keep this
      // and the index.html script in sync if either changes.
      var pathSegmentsToKeep = 1 // "/stac-api-browser" — a project page, not a user/org page

      var location = window.location
      var segments = location.pathname.split('/')
      var base = segments.slice(0, 1 + pathSegmentsToKeep).join('/')
      var rest = segments.slice(1 + pathSegmentsToKeep).join('/')

      location.replace(
        base +
          '/?/' +
          rest.replace(/&/g, '~and~') +
          (location.search
            ? '&' + location.search.slice(1).replace(/&/g, '~and~')
            : '') +
          location.hash,
      )
    </script>
  </head>
  <body></body>
</html>
